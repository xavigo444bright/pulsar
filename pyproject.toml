[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsar"
version = "0.1.0"
description = "Open-source personal wealth agent: RSI-family factors, gated promotion, paper-first execution."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Pulsar" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
brokers = ["ccxt>=4.4.0", "ib-insync>=0.9.86"]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0"]

[project.scripts]
pulsar = "pulsar.cli:app"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
