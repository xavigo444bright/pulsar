name: ci
on:
  push:
  pull_request:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Strategy and agent evals
        run: pytest
      - name: Live stays off
        run: python -c "from pulsar.config import Settings; s=Settings(); assert s.live_enabled() is False"
